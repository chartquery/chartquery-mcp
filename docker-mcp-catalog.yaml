name: chartquery
image: mcp/chartquery
type: server
meta:
  category: media
  tags:
    - chartquery
    - chart-api
    - qr-code-api
    - barcode-api
    - diagram-api
about:
  title: ChartQuery
  description: Generate chart images, diagrams, barcodes, QR codes and thermal labels on demand. PNG, SVG or PDF output.
  icon: https://raw.githubusercontent.com/chartquery/chartquery-mcp/main/assets/icon-400.png
source:
  project: https://github.com/chartquery/chartquery-mcp
run:
  allowHosts:
    - api.chartquery.com:443
config:
  description: Configure your ChartQuery API key.
  secrets:
    - name: chartquery.api_key
      env: CHARTQUERY_API_KEY
      example: YOUR_API_KEY
      description: Required API key from https://app.chartquery.com.
      required: true
